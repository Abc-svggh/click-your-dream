name: Build Click Your Dream Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "assets/click-your-dream-logo.svg"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/assets app/src/main/java/com/clickyourdream/app app/src/main/res/drawable-nodpi app/src/main/res/values
          cp assets/click-your-dream-logo.svg app/src/main/assets/logo.svg
          sudo apt-get update
          sudo apt-get install -y imagemagick
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"; pixels="${spec##*:}"
            mkdir -p "app/src/main/res/mipmap-${density}"
            convert -background none assets/click-your-dream-logo.svg -resize "${pixels}x${pixels}" "app/src/main/res/mipmap-${density}/ic_launcher.png"
          done
          convert -background '#690018' assets/click-your-dream-logo.svg -resize 320x320 app/src/main/res/drawable-nodpi/splash_logo.png
          cat > app/src/main/res/drawable-nodpi/splash_background.xml <<'EOF'
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item><shape><solid android:color="#690018" /></shape></item>
              <item><bitmap android:src="@drawable/splash_logo" android:gravity="center" /></item>
          </layer-list>
          EOF
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#D9A33A</item>
                  <item name="android:windowBackground">@drawable/splash_background</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#690018</item>
                  <item name="android:navigationBarColor">#31000D</item>
              </style>
          </resources>
          EOF
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "ClickYourDream"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.clickyourdream.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.clickyourdream.app'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Click Your Dream"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="keyboard|keyboardHidden|orientation|screenSize"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/clickyourdream/app/MainActivity.java <<'EOF'
          package com.clickyourdream.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(false);
                  settings.setSupportZoom(true);
                  settings.setBuiltInZoomControls(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  setContentView(webView);
                  if (savedInstanceState == null) {
                      webView.loadUrl("file:///android_asset/index.html");
                  } else {
                      webView.restoreState(savedInstanceState);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  if (webView != null) webView.saveState(outState);
                  super.onSaveInstanceState(outState);
              }
          }
          EOF

      - name: Build offline APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Click-Your-Dream-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
